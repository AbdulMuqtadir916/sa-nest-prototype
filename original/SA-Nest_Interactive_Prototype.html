function stats(t,rr){return `<div class="grid">${[['Approved total',t.total,'tCO₂e','Scope 1 + location-based Scope 2'],['Scope 1',t.s1,'tCO₂e','Direct emissions'],['Scope 2',t.s2,'tCO₂e','Location-based'],['To review / revise',pending(rr).length,'records','Not yet final']].map(([a,b,c,d])=>`<div class="card"><small>${a}</small><div class="stat">${fmt(b,c==='records'?0:2)} <span>${c}</span></div><small>${d}</small></div>`).join('')}</div>`}

function portfolio(){return head('FMM consultant console','Manage independent client workspaces. Portfolio figures are not FMM’s corporate inventory.',btn('Add organisation','orgModal()','primary'))+`<div class="grid">${db.orgs.map(o=>{let rr=db.records.filter(r=>r.org===o.id&&r.period===period),t=totals(rr);return `<div class="card facility-card"><div class="iconbox">▦</div><h2>${esc(o.name)}</h2><small>${esc(o.industry)} · ${db.fac.filter(f=>f.org===o.id).length} facilities</small><div class="stat">${fmt(t.total)} <span>tCO₂e approved</span></div><small>${pending(rr).length} records pending · ${pLabel(period)}</small>${btn('Open workspace',`chooseOrg('${o.id}')`,'primary')}</div>`}).join('')}</div>`}
function organisations(){return head('Organisations','Client and corporate reporting entities.',btn('Add organisation','orgModal()','primary'))+`<div class="card">${table(['Organisation','Industry','Boundary','Facilities',''],db.orgs.map(o=>[esc(o.name),esc(o.industry),esc(o.boundary),db.fac.filter(f=>f.org===o.id).length,btn('Open',`chooseOrg('${o.id}')`)]))}</div>`}
function orgModal(){modal('Add organisation',`<div class="formgrid">${field('Organisation name',inp('on'))}${field('Industry',inp('oi'))}${field('Country',inp('oc','Qatar'))}${field('Consolidation approach',sel('ob',['Operational control','Financial control','Equity share'].map(x=>opt(x,x)).join('')))}${field('Reporting standard',sel('os',['GHG Protocol','ISO 14064-1 (demo)'].map(x=>opt(x,x)).join('')))}${field('Scope 2 reporting',sel('od',opt('0','Location-based only')+opt('1','Dual reporting (demo)')))}</div>${foot('Create organisation','saveOrg()')}`)}
function saveOrg(){let name=value('on');if(!name||!value('oi')||!value('oc'))return formError('Enter organisation, industry and country.');if(db.orgs.some(o=>o.name.toLowerCase()===name.toLowerCase()))return formError('Organisation already exists.');let id=uid();db.orgs.push({id,name,industry:value('oi'),country:value('oc'),boundary:value('ob'),standard:value('os'),dual:value('od')==='1'});org=id;fac='';log('Organisation created',name);closeModal();go('Home')}
function facilities(){return head('Facilities','Each physical site has a location. Zones are optional.',canAdmin()?btn('Add facility','facilityModal()','primary'):'')+`<div class="grid">${db.fac.filter(x=>x.org===org).map(f=>`<div class="card facility-card"><div class="row between"><div class="iconbox">▦</div>${badge('Active')}</div><h2>${esc(f.name)}</h2><small>${esc(f.type)} · ${esc(f.city)}, ${esc(orgObj().country)}</small><p>${esc(f.address)} · ${fmt(f.area,0)} m²</p><small>${f.zones.map(esc).join(' · ')||'No zones configured'}</small><div class="row">${btn('Open facility',`chooseFac('${f.id}')`,'primary')}${canAdmin()?btn('Manage zones',`zoneModal('${f.id}')`):''}</div></div>`).join('')||'<div class="card empty">Add your first facility.</div>'}</div>`}
function facilityModal(){modal('Add facility',`<div class="formgrid">${field('Facility name',inp('fn'))}${field('Facility type',sel('ft',facTypes.map(x=>opt(x,x)).join('')))}${field('City',inp('fc'))}${field('Floor area (m²)',inp('fa','','type="number" min="0"'))}${field('Street address',inp('fd'))}${field('Ownership / control',sel('fo',['Owned / controlled','Leased / controlled','Managed – assess boundary'].map(x=>opt(x,x)).join('')))}${field('Zones (optional, comma-separated)',inp('fz'))}</div>${foot('Create facility','saveFacility()')}`)}
function saveFacility(){if(!value('fn')||!value('fc')||!value('fd')||Number(value('fa'))<0)return formError('Enter name, city, address and valid area.');let id=uid();db.fac.push({id,org,name:value('fn'),type:value('ft'),city:value('fc'),address:value('fd'),area:Number(value('fa')),control:value('fo'),zones:[...new Set(value('fz').split(',').map(x=>x.trim()).filter(Boolean))]});log('Facility created',value('fn'));closeModal();chooseFac(id)}
function zoneModal(id){let f=facility(id);modal('Manage zones · '+f.name,`${field('Add zone',inp('zn'))}<p class="muted">Existing zones: ${f.zones.map(esc).join(', ')||'None'}</p>${foot('Add zone',`saveZone('${id}')`)}`)}function saveZone(id){let f=facility(id),z=value('zn');if(!z||f.zones.includes(z))return formError('Enter a new zone name.');f.zones.push(z);log('Zone created',f.name+' / '+z);closeModal();render()}
function locOpts(selId=fac){return opt('','Organisation-level',selId)+db.fac.filter(x=>x.org===org).map(x=>opt(x.id,x.name,selId)).join('')}
function equipment(){return head('Equipment & meters','A shared asset register. Link equipment to sources; aggregate sources do not need an asset.',canEdit()?btn('Add equipment or meter','assetModal()','primary'):'')+`<div class="card">${table(['Asset','Type','Facility','Zone','Linked sources'],db.assets.filter(a=>a.org===org&&(!fac||a.fac===fac)).map(a=>[esc(a.name),esc(a.type),esc(facility(a.fac)?.name||'Organisation-level'),esc(a.zone||'—'),db.sources.filter(s=>s.asset===a.id).length]))}</div>`}
function assetModal(){modal('Add equipment or meter',`${field('Asset name / code',inp('an'))}${field('Type',sel('at',opt('Equipment','Equipment')+opt('Meter','Meter')))}${field('Facility',sel('af',locOpts(),'onchange="assetZones()"'))}${field('Zone',sel('az',opt('','No zone')))}${foot('Save asset','saveAsset()')}`);assetZones()}
function assetZones(){let f=facility(value('af'));$('az').innerHTML=opt('','No zone')+(f?.zones||[]).map(x=>opt(x,x)).join('')}
function saveAsset(){let n=value('an'),f=value('af');if(!n)return formError('Enter an asset name.');if(db.assets.some(a=>a.org===org&&a.fac===f&&a.name.toLowerCase()===n.toLowerCase()))return formError('Asset already exists.');db.assets.push({id:uid(),org,fac:f,name:n,type:value('at'),zone:value('az')});log('Asset created',n);closeModal();render()}
function scopeTabs(){return `<div class="tabs">${[1,2].map(s=>`<button class="${scope===s?'active':''}" onclick="scope=${s};render()">Scope ${s} · ${s===1?'Direct':'Purchased energy'}</button>`).join('')}</div>`}
function sourcesPage(){return head('Emission sources','Register what needs measuring, or assess categories as not applicable.',canEdit()?btn('Add emission source','sourceModal()','primary'):'')+scopeTabs()+categoryBoxes(false)}
function categoryBoxes(collect){let ss=srcs(),rr=rows();return cats[scope].map(cat=>{let items=ss.filter(s=>fct(s.factor).cat===cat),key=`${org}|${fac}|${cat}`,na=db.na[key];return `<div class="scopebox"><div class="scopehead"><div><h3>${cat}</h3><small>${items.length} sources configured${na?' · '+(fac?'Facility':'Central activities')+' N/A':''}</small></div><div class="row">${canEdit()&&!locked()?btn('+ Add emission source',`sourceModal('${cat}',${collect})`):''}${canAdmin()&&!locked()&&!items.some(s=>s.fac===fac)?btn(na?'Clear N/A':(fac?'Mark not applicable':'Mark central activities N/A'),`toggleNA('${cat}')`):''}</div></div><div class="scopebody">${items.length?table(collect?['Source','Facility / zone','Activity status','']:['Source','Facility / zone','Equipment','Activity type',''],items.map(s=>{let rrs=rr.filter(r=>r.source===s.id);return collect?[esc(s.name),esc((facility(s.fac)?.name||'Organisation-level')+(s.zone?' / '+s.zone:'')),rrs.length?rrs.map(r=>badge(current(r).status)).join(' '):badge('Data pending'),canEdit()&&!locked()?btn('Add activity',`entryModal('${s.id}')`):'']:[esc(s.name),esc((facility(s.fac)?.name||'Organisation-level')+(s.zone?' / '+s.zone:'')),esc(asset(s.asset)?.name||'Aggregate'),esc(fct(s.factor).name),btn('Collect',`go('Data collection');scope=${scope};render()`)]})): `<p class="muted">${na?'Not applicable · '+esc(na):'Not assessed / not configured. Missing is not zero.'}</p>`}</div></div>`}).join('')}
function toggleNA(cat){let k=`${org}|${fac}|${cat}`;if(db.na[k])delete db.na[k];else{let reason=prompt('Why is this category not applicable to '+(fac?facility(fac).name:'organisation-level activities')+'?');if(!reason?.trim())return;db.na[k]=reason.trim()}log('Applicability updated',cat);render()}
function sourceModal(cat=cats[scope][0],collect=false){if(!canEdit()||!ensureOpen())return;modal('Add emission source',`<p class="muted" style="margin-bottom:12px">Register a source and optionally link or create equipment without leaving this workflow.</p>${field('Source name',inp('sn'))}${field('Facility',sel('sf',locOpts(),'onchange="sourceFields()"'))}${field('Category / activity',sel('st',factors.filter(f=>f.scope===scope).map(f=>opt(f.id,f.cat+' · '+f.name,factors.find(v=>v.cat===cat)?.id)).join('')))}${field('Zone',sel('sz',opt('','No zone')))}${field('Equipment or meter',sel('sa',opt('','Aggregate / no equipment'),'onchange="$(\'newasset\').style.display=this.value===\'new\'?\'block\':\'none\'"'))}<div id="newasset" style="display:none">${field('New asset name',inp('san'))}${field('Asset type',sel('sat',opt('Equipment','Equipment')+opt('Meter','Meter')))}</div>${foot(collect?'Save & enter activity':'Save source',`saveSource(${collect})`)}`);sourceFields()}
function sourceFields(){let f=value('sf');$('sz').innerHTML=opt('','No zone')+(facility(f)?.zones||[]).map(x=>opt(x,x)).join('');$('sa').innerHTML=opt('','Aggregate / no equipment')+db.assets.filter(a=>a.org===org&&a.fac===f).map(a=>opt(a.id,a.name)).join('')+opt('new','+ Create new equipment / meter');$('newasset').style.display='none'}
function saveSource(collect){let n=value('sn'),f=value('sf'),ft=value('st'),a=value('sa'),z=value('sz');if(!n||!fct(ft))return formError('Enter source name and activity.');if(db.sources.some(s=>s.org===org&&s.fac===f&&s.name.toLowerCase()===n.toLowerCase()))return formError('Source name already exists at this location.');if(a==='new'){let an=value('san');if(!an||db.assets.some(a=>a.org===org&&a.fac===f&&a.name.toLowerCase()===an.toLowerCase()))return formError('Enter a unique asset name.');a=uid();db.assets.push({id:a,org,fac:f,name:an,zone:z,type:value('sat')})}let id=uid();db.sources.push({id,org,fac:f,name:n,factor:ft,asset:a,zone:z,active:true});delete db.na[`${org}|${f}|${fct(ft).cat}`];log('Emission source created',n);closeModal();render();if(collect)entryModal(id)}
function collection(){let rr=rows().filter(r=>scopeOf(r)===scope);return head('Data collection','Enter actual consumption, upload a structured file, or revise an existing activity.',canEdit()&&!locked()?btn('Upload Excel / CSV','importModal()','primary')+btn('Download CSV template','template()'):'')+scopeTabs()+categoryBoxes(true)+`<div class="card section"><h2>Activity records · ${pLabel(period)}</h2>${recordTable(rr,true)}</div>`}
function recordTable(rr,actions=false){return table(['Source / facility','Reference','Quantity','Emissions tCO₂e','Status','Version',''],rr.map(r=>{let v=current(r);return [esc(source(r.source).name)+'<br><small>'+esc(facility(r.fac)?.name||'Organisation-level')+'</small>',esc(r.ref),fmt(v.q)+' '+esc(v.unit),fmt(co2(v),3),badge(v.status),r.versions.length,btn('Details',`detail('${r.id}')`)+(actions&&canEdit()&&!locked()?btn(v.status==='Approved'?'Revise':'Edit / revise',`entryModal('${r.source}','${r.id}')`):'')]}))}
function entryModal(id,rid=''){if(!canEdit()||!ensureOpen())return;let s=source(id),f=fct(s.factor),r=db.records.find(x=>x.id===rid),v=r&&current(r);modal(r?'Revise activity':'Add activity data',`<div class="notice">${esc(s.name)} · Scope ${f.scope} · ${esc(facility(s.fac)?.name||'Organisation-level')} · ${pLabel(period)}</div>${field('Activity reference (unique for source and month)',inp('er',r?.ref||'Monthly total',r?'readonly':''))}${field('Quantity ('+esc(f.unit)+')',inp('eq',v?.q??'','type="number" min="0" step="any" oninput="preview(\''+id+'\')"'))}${field('Evidence reference / notes',inp('ee',v?.evidence||''))}${field('Attach supporting file (name retained in demo)',`<input id="efile" type="file" accept=".pdf,.jpg,.png,.xlsx,.csv"/>`)}${field('Reason / change description',inp('why',r?'':'Initial entry'))}<div class="card" id="preview"></div><div id="formerr" class="err"></div><div class="modalfoot">${btn('Cancel','closeModal()')}${btn('Save draft',`saveEntry('${id}','${rid}','Draft')`)}${btn('Submit for review',`saveEntry('${id}','${rid}','Submitted')`,'primary')}</div>`);preview(id)}
function preview(id){let f=fct(source(id).factor),q=Number(value('eq'));$('preview').innerHTML=`<small>Calculation preview · mock factor v1</small><div class="stat">${fmt(q>=0?q*f.ef/1000:0,3)} <span>tCO₂e</span></div><small>${esc(f.name)} · ${f.ef} kgCO₂e/${esc(f.unit)} · quantity × factor ÷ 1,000</small>${f.scope===2&&orgObj().dual?`<p>Alternative market-based demo: ${fmt(q*(f.mb??f.ef)/1000,3)} tCO₂e</p>`:''}`}
function newVersion(s,q,status,evidence,reason){let f=fct(s.factor);return {id:uid(),q,unit:f.unit,ef:f.ef,mb:f.mb??f.ef,method:'Demo factor v1',status,at:today(),by:role,evidence,reason}}
function saveEntry(id,rid,status){if(!ensureOpen())return;let s=source(id),q=Number(value('eq')),ref=value('er'),reason=value('why'),evidence=[value('ee'),$('efile').files[0]?.name].filter(Boolean).join(' · ');if(!value('eq')||!Number.isFinite(q)||q<0||!ref||!reason)return formError('Enter non-negative quantity, reference and reason.');let r=db.records.find(x=>x.id===rid);if(!r&&db.records.some(x=>x.source===id&&x.period===period&&x.ref.toLowerCase()===ref.toLowerCase()))return formError('Duplicate reference. Revise the existing record instead.');if(!r&&db.records.some(x=>x.source===id&&x.period===period&&(x.ref.toLowerCase()==='monthly total'||ref.toLowerCase()==='monthly total')))return formError('Monthly total overlaps existing activity records. Revise it or use a separate non-overlapping source.');if(r&&r.period!==period)return formError('Reporting period mismatch.');if(!r){r={id:uid(),org,fac:s.fac,source:id,period,ref,versions:[]};db.records.push(r)}let prev=current(r);if(prev&&prev.status!=='Approved')prev.status='Superseded';r.versions.push(newVersion(s,q,status,evidence,reason));log('Activity '+status.toLowerCase(),s.name+' / '+ref+' / v'+r.versions.length);closeModal();render();toast('Activity '+status.toLowerCase())}
function detail(id){let r=db.records.find(x=>x.id===id);modal('Calculation record · '+source(r.source).name,`<p class="muted">${esc(r.ref)} · ${pLabel(r.period)} · ${esc(facility(r.fac)?.name||'Organisation-level')}</p>${r.versions.map((v,i)=>`<div class="card section"><div class="row between"><h3>Version ${i+1}</h3>${badge(v.status)}</div><p class="mono">${fmt(v.q)} ${esc(v.unit)} × ${v.ef} ÷ 1,000 = ${fmt(co2(v),3)} tCO₂e</p><p>${esc(v.method)} · ${esc(v.id)}</p><small>${esc(v.at)} · ${esc(v.by)}</small><p>Evidence: ${esc(v.evidence||'None recorded')}</p><p>Reason: ${esc(v.reason)}</p></div>`).join('')}<div class="modalfoot">${btn('Close','closeModal()')}</div>`)}
function reviews(){let rr=rows().filter(r=>current(r).status==='Submitted');return head('Reviews & approvals','Submitted calculations are excluded from approved inventory until reviewed. Prior approved versions remain effective while a revision is pending.')+`<div class="card">${table(['Source','Reference','Quantity','tCO₂e','Action'],rr.map(r=>{let v=current(r);return [esc(source(r.source).name),esc(r.ref),fmt(v.q)+' '+esc(v.unit),fmt(co2(v),3),btn('Details',`detail('${r.id}')`)+(canReview()&&!locked()?btn('Approve',`review('${r.id}',true)`,'primary')+btn('Return',`review('${r.id}',false)`):'')]}))}</div><div class="card section"><h2>Other unfinished records</h2>${recordTable(rows().filter(r=>['Draft','Returned'].includes(current(r).status)),true)}</div>`}
function review(id,yes){if(!canReview()||!ensureOpen())return;let r=db.records.find(x=>x.id===id),v=current(r);if(v.status!=='Submitted')return;let reason=yes?'Approved in demo':prompt('Reason for returning this record:');if(!reason?.trim())return;if(yes)for(let old of r.versions)if(old!==v&&old.status==='Approved')old.status='Superseded';v.status=yes?'Approved':'Returned';v.review={by:role,at:today(),reason};log(v.status,source(r.source).name+' / '+r.ref+' / '+reason);render();toast(v.status)}
function inventory(){let rr=rows(),t=totals(rr);return head('GHG inventory','Approved, non-duplicated activity records. Scope 3 is not assessed.',btn('Export approved CSV','exportInventory()','primary'))+stats(t,rr)+`<div class="card section"><h2>Consolidated by facility</h2>${table(['Facility','Scope 1','Scope 2 location','Total location',...(orgObj().dual?['Scope 2 market (alternative)']:[])],(fac?[facility(fac)]:db.fac.filter(f=>f.org===org).concat([{id:'',name:'Organisation-level'}])).map(f=>{let a=totals(rr.filter(r=>r.fac===f.id));return [esc(f.name),fmt(a.s1),fmt(a.s2),fmt(a.total),...(orgObj().dual?[fmt(a.mb)]:[])]}))}</div><div class="card section"><h2>Approved source records</h2>${table(['Scope','Category','Source','Facility','Quantity','tCO₂e',''],rr.filter(r=>approved(r)).map(r=>{let s=source(r.source),v=approved(r);return [scopeOf(r),esc(fct(s.factor).cat),esc(s.name),esc(facility(r.fac)?.name||'Organisation-level'),fmt(v.q)+' '+esc(v.unit),fmt(co2(v),3),btn('Trace',`detail('${r.id}')`)]}))}<p class="muted section">Missing: ${missing().length} configured sources · ${notAssessed().length} unassessed categories · ${pending(rr).length} unfinished records. This may be a partial inventory.</p></div>`}
function exportInventory(){let a=[['organisation','facility','period','scope','source','reference','quantity','unit','factor','tCO2e','market_tCO2e_alternative','version']];for(let r of rows()){let v=approved(r);if(v)a.push([orgObj().name,facility(r.fac)?.name||'Organisation-level',period,scopeOf(r),source(r.source).name,r.ref,v.q,v.unit,v.ef,co2(v),orgObj().dual&&scopeOf(r)===2?co2(v,true):'',v.id])}download('SA-Nest-demo-inventory.csv',a.map(csvLine).join('\n'))}
function history(){let opts=['Calculation history','Import history','Audit trail'];return head('History & audit','Trace calculations, imports and actions separately. Demo logs are local, not tamper-proof.')+`<div class="tabs">${opts.map(x=>`<button class="${historyTab===x?'active':''}" onclick="historyTab='${x}';render()">${x}</button>`).join('')}</div><div class="card">${historyTab===opts[0]?table(['Period','Source','Reference','Versions','Current status',''],db.records.filter(r=>r.org===org&&(!fac||r.fac===fac)).map(r=>[pLabel(r.period),esc(source(r.source).name),esc(r.ref),r.versions.length,badge(current(r).status),btn('View history',`detail('${r.id}')`)])):historyTab===opts[1]?table(['File','Period','Imported','Rejected','By','Time'],db.imports.filter(i=>i.org===org).map(i=>[esc(i.name),pLabel(i.period),i.ok,i.bad,esc(i.by),esc(i.at)])):table(['Time','Actor','Action','Details'],db.audit.filter(i=>i.org===org).map(i=>[esc(i.at),esc(i.by),esc(i.action),esc(i.detail)]))}</div>`}
function template(){let ss=srcs().filter(s=>fct(s.factor).scope===scope);download('SA-Nest-scope-'+scope+'-template.csv',[['source_id','period','reference','quantity','unit','evidence'],...ss.map(s=>[s.id,period,'','',fct(s.factor).unit,''])].map(csvLine).join('\n'))}
function importModal(){if(!canEdit()||!ensureOpen())return;modal('Upload Excel or CSV',`<div class="notice">Scope ${scope} · ${pLabel(period)}. Download the template for valid source IDs. One row per activity. The first worksheet is used for .xlsx files.</div>${field('Select file','<input id="ifile" type="file" accept=".csv,.xlsx">')}<div class="row">${btn('Download template','template()')}${btn('Load sample rows','sampleImport()')}</div><div id="importpreview" class="section"></div><div id="formerr" class="err"></div><div class="modalfoot">${btn('Cancel','closeModal()')}${btn('Validate file','validateFile()')}${btn('Import valid rows','commitImport()','primary')}</div>`)}
function parseCSV(t){let out=[],r=[],v='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(!quoted&&c===','){r.push(v);v=''}else if(!quoted&&(c==='\n'||c==='\r')){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);if(r.some(Boolean))out.push(r);r=[];v=''}else v+=c}if(quoted)throw Error('Unclosed CSV quotation.');r.push(v);if(r.some(Boolean))out.push(r);return out}
async function parseXlsx(file){let b=new Uint8Array(await file.arrayBuffer()),dv=new DataView(b.buffer),u16=i=>dv.getUint16(i,true),u32=i=>dv.getUint32(i,true),dec=new TextDecoder(),end=-1;for(let i=b.length-22;i>=Math.max(0,b.length-65557);i--)if(u32(i)===0x06054b50){end=i;break}if(end<0)throw Error('Invalid XLSX ZIP');let n=u16(end+10),p=u32(end+16),parts={};for(let i=0;i<n;i++){if(u32(p)!==0x02014b50)throw Error('Invalid ZIP directory');let method=u16(p+10),size=u32(p+20),nl=u16(p+28),xl=u16(p+30),cl=u16(p+32),off=u32(p+42),name=dec.decode(b.slice(p+46,p+46+nl));let start=off+30+u16(off+26)+u16(off+28);parts[name]={method,bytes:b.slice(start,start+size)};p+=46+nl+xl+cl}async function xml(name){let item=parts[name];if(!item)return null;let data=item.bytes;if(item.method===8){if(typeof DecompressionStream==='undefined')throw Error('This browser cannot unpack XLSX. Save as CSV and retry.');data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}else if(item.method!==0)throw Error('Unsupported ZIP compression');return new DOMParser().parseFromString(dec.decode(data),'application/xml')}let wb=await xml('xl/workbook.xml'),rel=await xml('xl/_rels/workbook.xml.rels'),sheet=wb?.getElementsByTagName('sheet')[0],rid=sheet?.getAttribute('r:id'),target=[...(rel?.getElementsByTagName('Relationship')||[])].find(x=>x.getAttribute('Id')===rid)?.getAttribute('Target'),path=target?(target.startsWith('/')?target.slice(1):'xl/'+target.replace(/^\.\//,'')):'xl/worksheets/sheet1.xml',ws=await xml(path);if(!ws)throw Error('No worksheet found');let ss=await xml('xl/sharedStrings.xml'),strings=[...(ss?.getElementsByTagName('si')||[])].map(x=>[...x.getElementsByTagName('t')].map(y=>y.textContent).join(''));return [...ws.getElementsByTagName('row')].map(row=>{let vals=[];for(let c of row.getElementsByTagName('c')){let letters=(c.getAttribute('r')||'A').match(/^[A-Z]+/)[0],ix=[...letters].reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1,t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0]?.textContent||'';vals[ix]=t==='s'?strings[Number(v)]||'':t==='inlineStr'?[...c.getElementsByTagName('t')].map(x=>x.textContent).join(''):v}return vals}).filter(r=>r.some(Boolean))}
async function validateFile(){let f=$('ifile').files[0];if(!f)return formError('Choose a CSV or XLSX file.');pendingImport=null;try{if(f.size>5*1024*1024)throw Error('Demo file limit is 5 MB.');let data=f.name.toLowerCase().endsWith('.xlsx')?await parseXlsx(f):parseCSV((await f.text()).replace(/^\uFEFF/,''));validateRows(data,f.name)}catch(e){formError(e.message)}}
function sampleImport(){let s=srcs().find(x=>fct(x.factor).scope===scope&&!db.records.some(r=>r.source===x.id&&r.period===period&&r.ref.toLowerCase()==='monthly total'));if(!s)return formError('Choose a source without a monthly total or add a source first.');let u=fct(s.factor).unit;validateRows([['source_id','period','reference','quantity','unit','evidence'],[s.id,period,'Demo batch '+uid(),25,u,'Sample log'],[s.id,period,'Invalid example',-10,u,''],['unknown',period,'Bad source',30,u,'']],'Sample import.csv')}
function validateRows(data,name){let h=(data.shift()||[]).map(v=>String(v||'').trim().toLowerCase()),required=['source_id','period','reference','quantity','unit'];if(required.some(k=>!h.includes(k)))return formError('Missing required columns: '+required.join(', '));let seen=new Set(),parsed=data.map((a,i)=>{let get=k=>String(a[h.indexOf(k)]??'').trim(),id=get('source_id'),s=source(id),p=get('period'),ref=get('reference'),q=Number(get('quantity')),unit=get('unit'),dup=id+'|'+p+'|'+ref.toLowerCase(),err='';if(!s||s.org!==org||(fac&&s.fac!==fac)||fct(s.factor).scope!==scope)err='Unknown or out-of-context source';else if(p!==period)err='Reporting period mismatch';else if(!ref||!get('quantity')||!Number.isFinite(q)||q<0)err='Invalid reference or quantity';else if(unit!==fct(s.factor).unit)err='Unit mismatch: expected '+fct(s.factor).unit;else if(db.records.some(r=>r.source===id&&r.period===p&&(r.ref.toLowerCase()==='monthly total'||ref.toLowerCase()==='monthly total'))||[...seen].some(k=>k.startsWith(id+'|'+p+'|')&&(k.endsWith('|monthly total')||ref.toLowerCase()==='monthly total')))err='Monthly total overlaps other records';else if(seen.has(dup)||db.records.some(r=>r.source===id&&r.period===p&&r.ref.toLowerCase()===ref.toLowerCase()))err='Duplicate reference';seen.add(dup);return {line:i+2,id,p,ref,q,unit,evidence:get('evidence'),err}});pendingImport={name,parsed};$('formerr').textContent='';$('importpreview').innerHTML=`<p><b>${parsed.filter(x=>!x.err).length} valid</b> · ${parsed.filter(x=>x.err).length} rejected</p>${table(['Row','Source','Reference','Quantity','Validation'],parsed.slice(0,100).map(x=>[x.line,esc(source(x.id)?.name||x.id),esc(x.ref),esc(x.q)+' '+esc(x.unit),x.err?`<span class="tag bad">${esc(x.err)}</span>`:badge('Valid')]))}`}
function commitImport(){if(!pendingImport)return formError('Validate a file or sample first.');if(!ensureOpen())return;let {name,parsed}=pendingImport,ok=0,bad=0;for(let x of parsed){if(x.err){bad++;continue}let s=source(x.id);if(db.records.some(r=>r.source===x.id&&r.period===period&&(r.ref.toLowerCase()===x.ref.toLowerCase()||r.ref.toLowerCase()==='monthly total'||x.ref.toLowerCase()==='monthly total'))){bad++;continue}db.records.push({id:uid(),org,fac:s.fac,source:s.id,period,ref:x.ref,versions:[newVersion(s,x.q,'Submitted',x.evidence||name,'Imported from '+name)]});ok++}db.imports.unshift({org,name,period,ok,bad,by:role,at:today(),rows:parsed});log('File imported',name+' · '+ok+' submitted / '+bad+' rejected');closeModal();render();toast(ok+' rows submitted for review')}
function reports(){let rr=rows(true),t=totals(rr),g=notAssessed(srcs(true),''),m=missing(srcs(true),rr);return head('Reports','Organisation-level inventory snapshots and period controls.',canAdmin()?btn(locked()?'Reopen period':'Close period',`periodAction(${locked()})`,'primary'):'')+`<div class="card"><h2>${pLabel(period)} · ${locked()?'Closed period':'Open period'}</h2><p>Scope 1: ${fmt(t.s1)} tCO₂e · Scope 2 location: ${fmt(t.s2)} tCO₂e · ${m.length} missing · ${g.length} unassessed categories · ${pending(rr).length} unfinished records.</p><p class="muted">Scope 3 excluded. A report can be saved as a draft while the period is open. Closing requires complete source and category assessment in this demo.</p><div class="row section">${canAdmin()?btn('Save report snapshot','makeReport()','primary'):''}${btn('Print current view','window.print()')}</div></div><div class="card section"><h2>Saved reports</h2>${table(['Report','Period','State','Scope 1','Scope 2 location','Total',''],db.reports.filter(r=>r.org===org).map(r=>[esc(r.id),pLabel(r.period),badge(r.closed?'Closed':'Draft'),fmt(r.t.s1),fmt(r.t.s2),fmt(r.t.total),btn('View snapshot',`reportDetail('${r.id}')`)]))}</div>`}
function periodAction(reopen){if(!canAdmin())return;if(reopen){let why=prompt('Reason for reopening the period:');if(!why?.trim())return;db.closed=db.closed.filter(x=>!(x.org===org&&x.period===period));log('Period reopened',period+' · '+why)}else{let rr=rows(true);if(pending(rr).length||missing(srcs(true),rr).length||notAssessed(srcs(true),'').length)return toast('Resolve missing data, unassessed categories and pending records before closing.');db.closed.push({org,period,at:today()});log('Period closed',period);makeReport(false)}render()}
function makeReport(show=true){let rr=rows(true),id='R-'+uid(),o=orgObj();db.reports.unshift({id,org,period,closed:locked(),t:totals(rr),at:today(),name:o.name,boundary:o.boundary,standard:o.standard,dual:o.dual,missing:missing(srcs(true),rr).length,gaps:notAssessed(srcs(true),'').length,pending:pending(rr).length,records:rr.filter(r=>approved(r)).map(r=>({source:source(r.source).name,fac:facility(r.fac)?.name||'Organisation-level',v:{...approved(r)}}))});log('Report snapshot saved',id);if(show){render();reportDetail(id)}}
function reportDetail(id){let r=db.reports.find(x=>x.id===id);modal('GHG report snapshot',`<div class="eyebrow">${r.closed?'Closed period':'Draft'} · ${pLabel(r.period)} · ${esc(r.id)}</div><h1>${esc(r.name)}</h1><p>${esc(r.boundary)} · ${esc(r.standard)}</p><div class="stat">${fmt(r.t.total)} <span>tCO₂e</span></div><p>Scope 1: ${fmt(r.t.s1)} · Scope 2 location: ${fmt(r.t.s2)}${r.dual?' · Scope 2 market alternative: '+fmt(r.t.mb):''}</p><p class="muted">Missing sources: ${r.missing}; unassessed categories: ${r.gaps}; unfinished records: ${r.pending}. Scope 3 not assessed. Mock factors; not for disclosure.</p><div class="section">${table(['Source','Facility','Quantity','tCO₂e','Version'],r.records.map(x=>[esc(x.source),esc(x.fac),fmt(x.v.q)+' '+esc(x.v.unit),fmt(co2(x.v),3),esc(x.v.id)]))}</div><div class="modalfoot">${btn('Download snapshot CSV',`reportCSV('${id}')`,'primary')}${btn('Close','closeModal()')}</div>`)}
function reportCSV(id){let r=db.reports.find(x=>x.id===id);download(id+'.csv',[['organisation','period','boundary','state','scope_1','scope_2_location','total_location','scope_2_market_alternative','missing','unassessed','unfinished','note'],[r.name,r.period,r.boundary,r.closed?'Closed':'Draft',r.t.s1,r.t.s2,r.t.total,r.dual?r.t.mb:'',r.missing,r.gaps,r.pending,'Mock factors; Scope 3 excluded'],[],['source','facility','quantity','unit','factor','tCO2e','version'],...r.records.map(x=>[x.source,x.fac,x.v.q,x.v.unit,x.v.ef,co2(x.v),x.v.id])].map(csvLine).join('\n'))}
function settings(){let o=orgObj();return head('Settings','Workspace configuration and demonstration controls.')+`<div class="two"><div class="card"><h2>Organisation profile</h2>${field('Reporting entity',esc(o.name))}${field('Country',esc(o.country))}${field('Reporting boundary',esc(o.boundary))}${field('Reporting standard',esc(o.standard))}${field('Scope 2 method',o.dual?'Dual reporting (demo)':'Location-based only')}${fac?field('Facility location',esc(facility(fac).city)+' · '+esc(facility(fac).address)):''}<small>Boundary settings are selected at onboarding. Production changes require controlled recalculation and approval.</small></div><div class="card"><h2>Prototype settings</h2><p>Changes are stored locally where browser storage is available. This file has no server, actual user authentication or secure audit storage.</p><div class="row section">${btn('Export demo backup','download(\'SA-Nest-demo-backup.json\',JSON.stringify(db,null,2),\'application/json\')')}${btn('Reset demo','resetDemo()','danger')}</div></div></div>`}
function resetDemo(){if(!confirm('Reset all local demo changes?'))return;db=seed();org='o1';fac='';period='2026-11';role='Consultant admin';persist();go('Home')}
function library(){return head('Emission factor library','Read-only demonstration factors. These values are invented or illustrative, not verified Qatar reporting factors.')+`<div class="card">${table(['Scope','Category','Factor','Unit','kgCO₂e/unit','Version'],factors.map(f=>[f.scope,esc(f.cat),esc(f.name),esc(f.unit),f.ef,'Demo v1']))}</div>`}
$('shade').addEventListener('click',e=>{if(e.target===$('shade'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
